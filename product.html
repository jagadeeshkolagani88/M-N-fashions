<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Product - M & N Fashions</title><link rel="stylesheet" href="style.css"></head><body>
<header class="header"><a class="menu-btn" href="shop.html">←</a><div class="brand"><img class="mini-logo" src="assets/mn-logo.png">M & N Fashions</div><a class="cart-btn" href="cart.html">🛒 <span class="cart-count">0</span></a></header>
<main class="container"><div class="product"><img id="pic"><div><h1 id="name"></h1><div id="price" class="price"></div>
<div class="options"><h3>Colours</h3><button class="option">Black</button><button class="option">White</button><button class="option">Red</button><button class="option">Blue</button></div>
<div class="options"><h3>Sizes</h3><button class="option">S</button><button class="option">M</button><button class="option">L</button><button class="option">XL</button><button class="option">XXL</button></div>
<button class="small-btn" onclick="add()">ADD TO CART</button><button class="small-btn" style="background:#333" onclick="buy()">BUY NOW</button></div></div></main>
<script src="script.js"></script><script>
const q=new URLSearchParams(location.search),cat=q.get('cat')||'tshirts',i=+(q.get('i')||0);const names={tshirts:['Classic Black T-Shirt','Premium White T-Shirt','Red Graphic T-Shirt','Oversized Blue T-Shirt'],shirts:['Classic White Shirt','Casual Blue Shirt','Black Slim Shirt','Checked Casual Shirt'],pants:['Blue Jeans','Black Jeans','Beige Trousers','Dark Cargo Pants'],jackets:['Black Denim Jacket','Blue Denim Jacket','Bomber Jacket','Casual Brown Jacket'],innerwear:['Cotton Vest','Classic Briefs','Comfort Trunks','Cotton Innerwear']}[cat];const n=names[i],price=[499,599,699,799][i];document.getElementById('pic').src=`assets/${cat}-${i+1}.svg`;document.getElementById('name').textContent=n;document.getElementById('price').textContent='₹'+price;document.querySelectorAll('.option').forEach(b=>b.onclick=()=>{document.querySelectorAll('.option').forEach(x=>x.classList.remove('selected'));b.classList.add('selected')});function add(){addToCart({name:n,price,cat,i});}function buy(){add();location.href='cart.html'}</script></body></html>
