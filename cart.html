<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cart - M & N Fashions</title><link rel="stylesheet" href="style.css"></head><body>
<header class="header"><a class="menu-btn" href="shop.html">←</a><div class="brand"><img class="mini-logo" src="assets/mn-logo.png">M & N Fashions</div></header>
<main class="container"><h1 class="title">Your Cart</h1><div id="cart"></div><div class="checkout"><div class="row"><b>Total</b><b id="total">₹0</b></div><button class="small-btn" onclick="location.href='checkout.html'">PLACE ORDER</button></div></main>
<script src="script.js"></script><script>
function render(){let c=cart();document.getElementById('cart').innerHTML=c.length?c.map((x,i)=>`<div class="row"><span>${x.name}</span><b>₹${x.price}</b></div>`).join(''):'<p>Your cart is empty.</p>';document.getElementById('total').textContent='₹'+c.reduce((a,x)=>a+x.price,0)}render();
</script></body></html>
