<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Category - M & N Fashions</title><link rel="stylesheet" href="style.css"></head><body>
<header class="header"><button class="menu-btn" onclick="history.back()">←</button><div class="brand"><img class="mini-logo" src="assets/mn-logo.png">M & N Fashions</div><a class="cart-btn" href="cart.html">🛒 <span class="cart-count">0</span></a></header>
<main class="container"><h1 id="title" class="title"></h1><div id="grid" class="grid"></div></main>
<script src="script.js"></script><script>
const p=new URLSearchParams(location.search),cat=p.get('cat')||'tshirts';document.getElementById('title').textContent=CATS[cat]||'Products';
const names={tshirts:['Classic Black T-Shirt','Premium White T-Shirt','Red Graphic T-Shirt','Oversized Blue T-Shirt'],shirts:['Classic White Shirt','Casual Blue Shirt','Black Slim Shirt','Checked Casual Shirt'],pants:['Blue Jeans','Black Jeans','Beige Trousers','Dark Cargo Pants'],jackets:['Black Denim Jacket','Blue Denim Jacket','Bomber Jacket','Casual Brown Jacket'],innerwear:['Cotton Vest','Classic Briefs','Comfort Trunks','Cotton Innerwear']}[cat];
document.getElementById('grid').innerHTML=names.map((n,i)=>`<div class="card"><img src="assets/${cat}-${i+1}.svg"><div class="card-body"><h3>${n}</h3><div class="price">₹${[499,599,699,799][i]}</div><a class="small-btn" style="display:block;text-align:center" href="product.html?cat=${cat}&i=${i}">VIEW PRODUCT</a></div></div>`).join('');
</script></body></html>
